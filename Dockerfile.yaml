# ============================================================
# DOCKERFILE - Transportation Security System
# ============================================================
# 
# WHAT: Packages the app so anyone can run it without installing Python
# 
# HOW TO USE:
# 1. Build: docker build -t transportation-security .
# 2. Run:   docker run -p 8501:8501 transportation-security
# 
# ============================================================

# Use Python 3.10 as the base image
FROM python:3.10-slim

# Set working directory inside the container
WORKDIR /app

# Copy requirements first (better caching)
COPY requirements.txt .

# Install dependencies
RUN pip install --no-cache-dir -r requirements.txt

# Copy the rest of the application
COPY . .

# Expose the Streamlit port
EXPOSE 8501

# Command to run the application
CMD ["streamlit", "run", "Dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]